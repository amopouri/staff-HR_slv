<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Salvatores — مرجع قوانین و آموزش Staff</title>
<meta name="description" content="مرجع جامع قوانین شهر، رابری، ارگان‌های نظامی و تیم Staff سرور سالواتورس" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090c;
  --panel:#11161d;
  --panel-2:#161d26;
  --panel-3:#1c2531;
  --line:rgba(255,255,255,.08);
  --line-strong:rgba(212,175,55,.30);
  --gold:#d4af37;
  --gold-2:#f2d888;
  --gold-dim:rgba(212,175,55,.12);
  --text:#eef1f5;
  --muted:#98a3b3;
  --muted-2:#6b7688;
  --danger:#ff6b6b;
  --ok:#4ade80;
  --radius:16px;
  --radius-sm:12px;
  --shadow:0 20px 50px rgba(0,0,0,.45);
  --font:"Vazirmatn",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html[data-theme="light"]{
  --bg:#f3f5f8;
  --panel:#ffffff;
  --panel-2:#f7f8fa;
  --panel-3:#edf0f4;
  --line:rgba(20,30,45,.10);
  --line-strong:rgba(155,117,20,.35);
  --gold:#a77d16;
  --gold-2:#8b6810;
  --gold-dim:rgba(167,125,22,.10);
  --text:#1d2633;
  --muted:#566273;
  --muted-2:#788393;
  --danger:#c53c3c;
  --shadow:0 18px 40px rgba(30,40,55,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--text);font-family:var(--font);
  font-size:15px;line-height:1.9;
  background:
    radial-gradient(circle at 88% -8%,rgba(212,175,55,.10),transparent 30rem),
    radial-gradient(circle at 8% 22%,rgba(39,86,160,.10),transparent 26rem),
    var(--bg);
}
body.no-scroll{overflow:hidden}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
button{cursor:pointer}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
mark{background:rgba(212,175,55,.32);color:inherit;border-radius:4px;padding:0 3px}
::selection{background:rgba(212,175,55,.35)}

/* ============ Layout ============ */
.shell{display:flex;min-height:100vh}

.sidebar{
  width:284px;flex:0 0 284px;position:sticky;top:0;height:100vh;
  padding:20px 14px;display:flex;flex-direction:column;gap:16px;z-index:40;
  background:linear-gradient(180deg,rgba(17,22,29,.98),rgba(7,9,12,.99));
  border-inline-start:1px solid var(--line);
}
html[data-theme="light"] .sidebar{background:linear-gradient(180deg,#fff,#f4f6f9)}

.brand{display:flex;align-items:center;gap:12px;padding:4px 6px 16px;border-bottom:1px solid var(--line)}
.brand-mark{
  width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  color:#101216;font-weight:900;font-size:24px;line-height:1;
  background:linear-gradient(145deg,var(--gold-2),var(--gold));
  box-shadow:0 10px 26px rgba(212,175,55,.25);
}
.brand strong{display:block;font-size:16px;font-weight:800}
.brand span{display:block;color:var(--muted);font-size:12px}

.nav{display:flex;flex-direction:column;gap:5px;overflow-y:auto;padding-inline-end:4px;flex:1}
.nav a{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);
  color:var(--muted);border:1px solid transparent;transition:.16s ease;font-size:14px;
}
.nav a svg{width:18px;height:18px}
.nav a:hover{color:var(--text);background:rgba(255,255,255,.04)}
.nav a.active{
  color:var(--gold-2);
  background:linear-gradient(90deg,var(--gold-dim),transparent);
  border-color:rgba(212,175,55,.20);
}
html[data-theme="light"] .nav a:hover{background:rgba(20,30,45,.05)}

.sidebar-foot{
  margin-top:auto;padding:12px 10px;border-top:1px solid var(--line);
  color:var(--muted-2);font-size:11.5px;display:flex;align-items:center;gap:8px;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}

.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:13px 26px;background:rgba(7,9,12,.82);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
html[data-theme="light"] .topbar{background:rgba(255,255,255,.86)}

.search{
  flex:1;max-width:720px;display:flex;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--line);
  padding:8px 12px;border-radius:13px;transition:.16s ease;
}
.search:focus-within{border-color:var(--line-strong);box-shadow:0 0 0 4px rgba(212,175,55,.08)}
.search svg{color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);padding:3px 0;font-size:14px}
.search input::placeholder{color:var(--muted-2)}
.search kbd{
  color:var(--muted-2);background:rgba(255,255,255,.05);border:1px solid var(--line);
  border-radius:7px;padding:2px 7px;font-size:11px;font-family:inherit;white-space:nowrap;
}

.icon-btn{
  width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;
  color:var(--text);background:var(--panel);border:1px solid var(--line);transition:.16s ease;
}
.icon-btn:hover{border-color:var(--line-strong);color:var(--gold-2)}
.menu-btn{display:none}

.view{width:100%;max-width:1120px;margin:0 auto;padding:30px 26px 70px;flex:1}

/* ============ Common ============ */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:7px;color:var(--muted-2);font-size:12.5px;margin-bottom:18px}
.crumbs a{color:var(--muted)}
.crumbs a:hover{color:var(--gold-2)}
.crumbs span.sep{opacity:.5}

h1,h2,h3{margin:0;line-height:1.5}
h1{font-size:clamp(24px,3vw,34px);font-weight:800}
h2{font-size:20px;font-weight:700}
h3{font-size:15.5px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.eyebrow{color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.6px;margin-bottom:6px}

.badge{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);font-size:11px;white-space:nowrap;
}
.badge.gold{color:var(--gold-2);background:var(--gold-dim);border-color:rgba(212,175,55,.20)}

.card{
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--line);border-radius:var(--radius);padding:20px;
}
html[data-theme="light"] .card{background:linear-gradient(180deg,#fff,#fbfcfd)}

.grid{display:grid;gap:14px}
.cards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

.stat .v{font-size:28px;font-weight:800;color:var(--gold-2);line-height:1.3}
.stat .l{color:var(--muted);font-size:12px}

.cat-card{
  display:flex;flex-direction:column;gap:12px;padding:20px;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--line);border-radius:var(--radius);
  transition:.18s ease;
}
.cat-card:hover{transform:translateY(-3px);border-color:var(--line-strong);box-shadow:var(--shadow)}
.cat-icon{
  width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  color:var(--gold-2);background:var(--gold-dim);border:1px solid rgba(212,175,55,.18);
}
.cat-card h3{font-size:16px}
.cat-card p{color:var(--muted);font-size:12.5px;line-height:1.9}

.section-list{display:flex;flex-direction:column;gap:9px}
.sec-link{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.025);
  border:1px solid var(--line);transition:.16s ease;
}
.sec-link:hover{background:var(--gold-dim);border-color:var(--line-strong)}
.sec-link .n{
  width:26px;height:26px;flex:0 0 auto;border-radius:8px;display:grid;place-items:center;
  font-size:11.5px;font-weight:700;color:var(--gold-2);background:var(--gold-dim);
  border:1px solid rgba(212,175,55,.18);margin-top:2px;
}
.sec-link .t{display:block;font-size:14px;font-weight:700;margin-bottom:3px}
.sec-link .d{display:block;color:var(--muted);font-size:12.5px;line-height:1.8}
.arrow{color:var(--muted-2);margin-top:3px}

/* ============ Reader ============ */
.reader-head{
  display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;
  margin-bottom:18px;
}
.reader-actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 14px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--text);font-size:13px;font-weight:600;transition:.16s ease;
}
.btn:hover{border-color:var(--line-strong);background:var(--panel-3)}
.btn.primary{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#111216;border-color:transparent}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.disabled{opacity:.4;pointer-events:none}

.summary{
  padding:16px 18px;border-radius:14px;margin-bottom:18px;
  background:linear-gradient(90deg,var(--gold-dim),transparent);
  border:1px solid rgba(212,175,55,.18);
  color:var(--text);font-size:14.5px;line-height:2;
}
.summary strong{color:var(--gold-2)}

.points{list-style:none;counter-reset:p;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.points li{
  counter-increment:p;position:relative;padding-inline-start:34px;
  font-size:14.5px;line-height:2;
}
.points li::before{
  content:counter(p);
  position:absolute;inset-inline-start:0;top:4px;
  width:23px;height:23px;border-radius:7px;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:var(--gold-2);
  background:var(--gold-dim);border:1px solid rgba(212,175,55,.20);
}

.note{
  margin-top:18px;padding:14px 16px;border-radius:13px;
  background:rgba(255,107,107,.07);border:1px solid rgba(255,107,107,.22);
  color:var(--text);font-size:13.5px;line-height:1.95;
}
.note b{color:var(--danger)}

/* ============ Table ============ */
.table-wrap{margin-top:16px;overflow-x:auto;border:1px solid var(--line);border-radius:13px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th,td{padding:11px 13px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:rgba(212,175,55,.07);color:var(--gold-2);font-weight:700;font-size:12px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(255,255,255,.03)}
html[data-theme="light"] th{background:rgba(167,125,22,.08)}

/* ============ Search ============ */
.result{
  display:block;padding:15px 17px;border-radius:14px;
  background:var(--panel);border:1px solid var(--line);transition:.16s ease;
}
.result:hover{border-color:var(--line-strong);background:var(--panel-2)}
.result .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.result .top strong{font-size:14px}
.result .snip{color:var(--muted);font-size:12.5px;line-height:1.9}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{
  padding:6px 12px;border-radius:999px;font-size:12px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);
  transition:.16s ease;
}
.chip:hover{color:var(--gold-2);border-color:var(--line-strong);background:var(--gold-dim)}

/* ============ Footer ============ */
.foot{
  border-top:1px solid var(--line);padding:18px 26px;color:var(--muted-2);
  font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
}

/* ============ Overlay / Drawer ============ */
.overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);
  z-index:35;opacity:0;transition:.2s ease;
}
.overlay.show{display:block;opacity:1}

.close-btn{display:none}

@media (max-width:980px){
  .sidebar{
    position:fixed;top:0;bottom:0;right:0;height:100%;
    transform:translateX(100%);transition:transform .24s ease;
    box-shadow:-20px 0 60px rgba(0,0,0,.5);
  }
  .sidebar.open{transform:none}
  .menu-btn{display:grid}
  .close-btn{display:grid}
  .view{padding:22px 16px 60px}
  .topbar{padding:11px 14px}
  .search kbd{display:none}
  .foot{padding:16px}
}
@media (max-width:560px){
  .cards{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  h1{font-size:23px}
  .points li{font-size:14px}
  th,td{padding:9px 11px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="ناوبری اصلی">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div style="flex:1"><strong>Salvatores</strong><span>Rules &amp; Staff Platform</span></div>
      <button class="icon-btn close-btn" id="closeBtn" aria-label="بستن منو">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot"><span class="dot"></span><span>نسخه ۲.۰ — همه قوانین در یک نگاه</span></div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="باز کردن منو">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <form class="search" id="searchForm" role="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="جستجو در قوانین… (مثلاً Fear RP یا خفت‌گیری)" autocomplete="off" aria-label="جستجو" />
        <kbd>Ctrl K</kbd>
      </form>
      <button class="icon-btn" id="themeBtn" aria-label="تغییر حالت روشن و تاریک">
        <svg id="themeIcon" viewBox="0 0 24 24"></svg>
      </button>
    </header>

    <main class="view" id="view" aria-live="polite"></main>

    <footer class="foot">
      <span>Salvatores Roleplay — مرجع قوانین و آموزش Staff</span>
      <span>جهل به قانون رافع مسئولیت نیست.</span>
    </footer>
  </div>
</div>

<script>
/* =====================================================================
   ICONS
   ===================================================================== */
const ICONS = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
  shield:'<path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6l7-3Z"/><path d="m9 12 2 2 4-4"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5v-13A2.5 2.5 0 0 1 6.5 3Z"/>',
  gavel:'<path d="m14 4 6 6"/><path d="m12 6 6 6"/><path d="m5 13 6 6"/><path d="m3 21 6-6"/><path d="m8 10 6 6"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h6"/>',
  warn:'<path d="M10.3 3.6 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  arrow:'<path d="m9 18 6-6-6-6"/>',
  chevron:'<path d="m15 18-6-6 6-6"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>'
};
const icon = (n,cls='') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||ICONS.file}</svg>`;

/* =====================================================================
   DATA — بازنویسی‌شده و مرتب‌شدهٔ تمام قوانین
   ===================================================================== */
const DATA = [
/* ------------------------------------------------------------------ */
{ id:'general', title:'قوانین عمومی شهر', icon:'shield',
  desc:'مبانی ورود به سرور، امنیت اکانت، ممنوعیت چیت و باگ، زبان رسمی، تبلیغات و مسیر ارتباط با تیم مدیریت.',
  sections:[
  { id:'account', title:'مالکیت و مسئولیت اکانت',
    summary:'مالکیت اکانت غیرقابل انتقال است و مسئولیت کامل آن — از جمله امنیت و رفتار — بر عهده صاحب اکانت است.',
    points:[
      'مالکیت اکانت و تمام دارایی‌های آن (پول، خودرو، ملک و آیتم‌ها) غیرقابل انتقال است و فقط به صاحب اکانت تعلق دارد.',
      'هر بازیکن در قبال اکانت خود — شامل Steam و Social Club — کاملاً مسئول است.',
      'استفاده از اکانت مشترک بین چند نفر ممنوع است؛ در صورت بن یا پانیشمنت، سایر استفاده‌کنندگان حق اعتراض ندارند.',
      'فعال‌سازی تایید دو مرحله‌ای برای حفظ امنیت اکانت توصیه می‌شود.',
      'در صورت لو رفتن اطلاعات اکانت، مسئولیت هرگونه خسارت بر عهده صاحب اکانت است.'
    ]},
  { id:'transactions', title:'خرید، فروش و تراکنش‌های غیرمجاز',
    summary:'هرگونه مراوده مالی خارج از بازی ممنوع است و خریدهای داخل بازی شما را در برابر تخلف مصون نمی‌کند.',
    points:[
      'خرید آیتم، خودرو یا دارایی داخل بازی ارتباطی با نقض قوانین ندارد؛ در صورت بن، خریدها قابل استناد نیستند و باید تا پایان مدت بن صبر کنید.',
      'بازگشت وجه خریدهای وب‌سایت تنها تا ۲۴ ساعت پس از خرید امکان‌پذیر است.',
      'تعویض یا فروش اکانت و دارایی‌های داخل بازی (پول، خودرو، خانه، حیوان و ...) با پول واقعی یا هر مراوده مالی خارج از بازی ممنوع است.',
      'خرید و فروش خودروهای VIP که با پول خارج از بازی تهیه شده‌اند غیرقانونی است و هر دو طرف معامله جریمه سنگین می‌شوند.',
      'مسئولیت مشکلات ناشی از معاملات غیرمجاز (مسدودی حساب، از بین رفتن آیتم‌ها و ...) کاملاً بر عهده کاربر است.',
      'در صورت گزارش مراوده مالی غیرمجاز، تیم مدیریت بدون اخطار قبلی حساب متخلفان را مسدود می‌کند.'
    ]},
  { id:'cheats', title:'چیت، ماد و نرم‌افزار مخرب',

/* =====================================================================
   UTILS
   ===================================================================== */
const $view = document.getElementById('view');
const $nav = document.getElementById('nav');
const $searchInput = document.getElementById('searchInput');
const $sidebar = document.getElementById('sidebar');
const $overlay = document.getElementById('overlay');
const $themeIcon = document.getElementById('themeIcon');

function esc(s){
  return String(s ?? '')
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'",'&#039;');
}
function escRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function norm(s){
  return String(s ?? '')
    .replace(/[يى]/g,'ی').replace(/ك/g,'ک')
    .replace(/[أإآ]/g,'ا').replace(/ۀ/g,'ه')
    .replace(/[\u200c\u200d\u200e\u200f]/g,' ')
    .replace(/[^\p{L}\p{N}\s]/gu,' ')
    .replace(/\s+/g,' ').trim().toLowerCase();
}
function catById(id){ return DATA.find(c=>c.id===id); }
function secById(catId,secId){
  const c = catById(catId);
  return c ? c.sections.find(s=>s.id===secId) : null;
}

/* =====================================================================
   INDEX
   ===================================================================== */
let INDEX = [];
function buildIndex(){
  INDEX = [];
  DATA.forEach(cat=>{
    cat.sections.forEach(sec=>{
      const text = [sec.title, sec.summary, ...(sec.points||[]),
        ...(sec.table ? sec.table.rows.flat() : [])].join(' ');
      INDEX.push({
        catId:cat.id, catTitle:cat.title,
        secId:sec.id, secTitle:sec.title,
        text, n:norm(text), nt:norm(sec.title)
      });
    });
  });
}

/* =====================================================================
   HIGHLIGHT & SEARCH
   ===================================================================== */
function highlight(text, terms){
  if(!terms.length) return esc(text);
  const re = new RegExp('(' + terms.map(escRe).join('|') + ')','gi');
  return String(text).split(re)
    .map((part,i)=> i%2 ? `<mark>${esc(part)}</mark>` : esc(part))
    .join('');
}
function snippet(text, terms){
  if(!terms.length) return esc(text.slice(0,190)) + (text.length>190?'…':'');
  const re = new RegExp(terms.map(escRe).join('|'),'i');
  const m = text.match(re);
  if(!m) return esc(text.slice(0,190)) + (text.length>190?'…':'');
  const i = m.index;
  const start = Math.max(0, i-60);
  const end = Math.min(text.length, i+180);
  return (start>0?'… ':'') + highlight(text.slice(start,end), terms) + (end<text.length?' …':'');
}
function countOcc(hay, needle){
  let n = 0, i = 0;
  while((i = hay.indexOf(needle, i)) !== -1){ n++; i += needle.length; }
  return n;
}
function doSearch(q){
  const terms = norm(q).split(' ').filter(t=>t.length>1);
  if(!terms.length) return [];
  const out = [];
  for(const it of INDEX){
    let ok = true, score = 0;
    for(const t of terms){
      if(!it.n.includes(t)){ ok = false; break; }
      score += countOcc(it.n, t) + (it.nt.includes(t) ? 6 : 0);
    }
    if(ok) out.push({...it, score});
  }
  return out.sort((a,b)=> b.score - a.score).slice(0, 60);
}

/* =====================================================================
   RENDER — NAV

function renderNav(){

    {href:'#/', title:'داشبورد', icon:'home'},
    ...DATA.map(c=>({href:`#/c/${c.id}`, title:c.title, icon:c.icon}))
  ];
  $nav.innerHTML = links.map(l=>
    `<a href="${l.href}" data-nav="${l.href}">${icon(l.icon)}<span>${esc(l.title)}</span></a>`
  ).join('');
}
function setActiveNav(catId){
  const target = catId ? `#/c/${catId}` : '#/';
  $nav.querySelectorAll('a').forEach(a=>{
    a.classList.toggle('active', a.getAttribute('data-nav') === target);
  });
}

/* =====================================================================
   RENDER — CATEGORY
   ===================================================================== */
function renderCategory(catId){

    ${crumbs([{label:'داشبورد', href:'#/'},{label:cat.title}])}
    <div class="eyebrow">دسته‌بندی قوانین</div>

    <p class="muted" style="margin-top:10px;max-width:780px">${esc(cat.desc)}</p>

    <div class="card" style="margin-top:24px">
      <div class="section-list">
        ${cat.sections.map((s,i)=>`
          <a class="sec-link" href="#/s/${cat.id}/${s.id}">
            <div style="display:flex;gap:12px;align-items:flex-start">
              <span class="n">${i+1}</span>
              <div>
                <span class="t">${esc(s.title)}</span>
                <span class="d">${esc(s.summary)}</span>

/* =====================================================================
   RENDER — SECTION (READER)
   ===================================================================== */
function renderSection(catId, secId){
  const cat = catById(catId);
  const sec = secById(catId, secId);
  if(!cat || !sec){ renderNotFound(); return; }
  setActiveNav(cat.id);

  const i = cat.sections.findIndex(s=>s.id===secId);
  const prev = cat.sections[i-1];
  const next = cat.sections[i+1];

  const prevBtn = prev
    ? `<a class="btn" href="#/s/${cat.id}/${prev.id}">${icon('chevron')} ${esc(prev.title)}</a>`
    : `<span class="btn disabled">${icon('chevron')} بخش قبلی</span>`;
  const nextBtn = next
    ? `<a class="btn primary" href="#/s/${cat.id}/${next.id}">${esc(next.title)} ${icon('arrow')}</a>`
    : `<span class="btn disabled">بخش بعدی ${icon('arrow')}</span>`;

  $view.innerHTML = `
    ${crumbs([
      {label:'داشبورد', href:'#/'},
      {label:cat.title, href:`#/c/${cat.id}`},
      {label:sec.title}
    ])}

    <div class="reader-head">
      <div style="min-width:0">
        <div class="eyebrow">${esc(cat.title)} · بخش ${i+1} از ${cat.sections.length}</div>
        <h1>${esc(sec.title)}</h1>
      </div>
      <div class="reader-actions">
        <a class="btn ghost" href="#/c/${cat.id}">فهرست دسته</a>
      </div>
    </div>

    <div class="summary"><strong>خلاصه:</strong> ${esc(sec.summary)}</div>

    <div class="card">
      <ol class="points">
        ${(sec.points||[]).map(p=>`<li>${esc(p)}</li>`).join('')}
      </ol>
      ${sec.table ? renderTable(sec.table) : ''}
      ${sec.note ? `<div class="note"><b>توجه:</b> ${esc(sec.note)}</div>` : ''}
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:22px">
      ${prevBtn}
      ${nextBtn}
    </div>`;
}

function renderTable(t){
  return `
    <div class="table-wrap">
      <table>
        <thead><tr>${t.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
        <tbody>
          ${t.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

/* =====================================================================
   RENDER — SEARCH
   ===================================================================== */
function renderSearch(q){
  setActiveNav(null);
  const query = (q || '').trim();
  const terms = norm(query).split(' ').filter(t=>t.length>1);

  if(!query){
    $view.innerHTML = `
      ${crumbs([{label:'داشبورد', href:'#/'},{label:'جستجو'}])}
      <div class="eyebrow">جستجو</div>
      <h1>جستجو در قوانین</h1>
      <p class="muted" style="margin-top:8px">عبارت مورد نظر را در نوار بالا وارد کنید.</p>`;
    return;
  }

  const results = doSearch(query);

  $view.innerHTML = `
    ${crumbs([{label:'داشبورد', href:'#/'},{label:'جستجو'},{label:query}])}
    <div class="eyebrow">نتیجه جستجو</div>
    <h1>«${esc(query)}»</h1>
    <p class="muted" style="margin-top:8px">${results.length} نتیجه در قوانین پیدا شد.</p>

    <div class="section-list" style="margin-top:22px">
      ${results.length ? results.map(r=>`
        <a class="result" href="#/s/${r.catId}/${r.secId}?q=${encodeURIComponent(query)}">
          <div class="top">
            <strong>${esc(r.secTitle)}</strong>
            <span class="badge gold">${esc(r.catTitle)}</span>
          </div>
          <div class="snip">${snippet(r.text, terms)}</div>
        </a>`).join('') : `
        <div class="card"><p class="muted">نتیجه‌ای پیدا نشد. املای عبارت یا نیم‌فاصله را بررسی کنید.</p></div>`}
    </div>`;
}

function renderNotFound(){
  $view.innerHTML = `
    ${crumbs([{label:'داشبورد', href:'#/'},{label:'یافت نشد'}])}
    <div class="card"><p class="muted">صفحه مورد نظر پیدا نشد.</p></div>`;
}

function crumbs(items){
  return `<div class="crumbs">${items.map((it,i)=>{
    const sep = i ? '<span class="sep">/</span>' : '';
    return it.href
      ? `${sep}<a href="${it.href}">${esc(it.label)}</a>`
      : `${sep}<span>${esc(it.label)}</span>`;
  }).join('')}</div>`;
}

/* =====================================================================
   ROUTER
   ===================================================================== */
function parseRoute(){
  const raw = location.hash.replace(/^#\/?/, '');
  const [pathPart, queryPart] = raw.split('?');
  const params = new URLSearchParams(queryPart || '');
  const parts = pathPart.split('/').filter(Boolean).map(p=>{
    try{ return decodeURIComponent(p); }catch(e){ return p; }
  });

  if(!parts.length) return {view:'dashboard'};
  if(parts[0] === 'c') return {view:'category', catId:parts[1] || ''};
  if(parts[0] === 's') return {view:'section', catId:parts[1] || '', secId:parts[2] || ''};
  if(parts[0] === 'search') return {view:'search', q:parts[1] || ''};
  return {view:'dashboard'};
}

function renderRoute(){
  const r = parseRoute();
  if(r.view === 'category') return renderCategory(r.catId);
  if(r.view === 'section') return renderSection(r.catId, r.secId);
  if(r.view === 'search') return renderSearch(r.q);
  return renderDashboard();
}

/* =====================================================================
   THEME
   ===================================================================== */
function applyTheme(mode){
  document.documentElement.dataset.theme = mode;
  $themeIcon.innerHTML = mode === 'light' ? ICONS.moon : ICONS.sun;
  try{ localStorage.setItem('salvatores-theme', mode); }catch(e){}
}
function initTheme(){
  let saved = 'dark';
  try{ saved = localStorage.getItem('salvatores-theme') || 'dark'; }catch(e){}
  applyTheme(saved);
}
document.getElementById('themeBtn').addEventListener('click', ()=>{
  applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
});

/* =====================================================================
   DRAWER
   ===================================================================== */
function openDrawer(){
  $sidebar.classList.add('open');
  $overlay.classList.add('show');
  document.body.classList.add('no-scroll');
}
function closeDrawer(){
  $sidebar.classList.remove('open');
  $overlay.classList.remove('show');
  document.body.classList.remove('no-scroll');
}
document.getElementById('menuBtn').addEventListener('click', openDrawer);
document.getElementById('closeBtn').addEventListener('click', closeDrawer);
$overlay.addEventListener('click', closeDrawer);
$sidebar.addEventListener('click', e=>{
  if(e.target.closest('a')) closeDrawer();
});

/* =====================================================================
   SEARCH EVENTS
   ===================================================================== */
document.getElementById('searchForm').addEventListener('submit', e=>{
  e.preventDefault();
  const q = $searchInput.value.trim();
  if(!q) return;
  location.hash = `#/search/${encodeURIComponent(q)}`;
  $searchInput.blur();
  closeDrawer();
});

document.addEventListener('keydown', e=>{
  const isTyping = /input|textarea|select/i.test(document.activeElement.tagName);
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    $searchInput.focus();
    $searchInput.select();
    return;
  }
  if(e.key === '/' && !isTyping){
    e.preventDefault();
    $searchInput.focus();
  }
  if(e.key === 'Escape' && document.activeElement === $searchInput){
    $searchInput.blur();
  }
});

/* =====================================================================
   BOOT
   ===================================================================== */
buildIndex();
initTheme();
renderNav();
renderRoute();

window.addEventListener('hashchange', ()=>{
  renderRoute();
  window.scrollTo({top:0, behavior:'smooth'});
});
</script>
